      <h1>BUKKBEEK — Jude Udumullage, 3D game artist &amp; Godot developer</h1>
      <p>
        Freelance 3D generalist, VFX artist and Godot developer from Sri Lanka, based in Ontario,
        Canada. I make stylized low-poly, game-ready 3D assets and tools for Godot, Unity and
        Unreal, and I am available for commissions.
      </p>

      <h2>Godot asset packs</h2>
      <ul>
        <li>
          <strong>EffectBlocks</strong> — 100+ customizable low-poly stylized 3D VFX effects for
          Godot: fire, smoke, explosions, magic, energy, decals and space effects.
          <a href="https://bukkbeek.itch.io/effectblocks">bukkbeek.itch.io/effectblocks</a>
        </li>
        <li>
          <strong>NatureBlocks</strong> — 500+ stylized nature assets for Godot with procedural
          terrain generation, vegetation scatter tools, materials, shaders and environment presets.
          <a href="https://bukkbeek.itch.io/natureblocks">bukkbeek.itch.io/natureblocks</a>
        </li>
        <li>
          <strong>Ceylon Blocks</strong> — free Sri Lankan heritage-inspired low-poly 3D asset
          collection celebrating cultural architecture and tropical environments.
        </li>
      </ul>

      <h2>Developer tools</h2>
      <ul>
        <li><strong>Godot Pixel Renderer</strong> — open-source 3D-to-pixel-art renderer for Godot 4.</li>
        <li><strong>Godot FPS Template</strong> — modular FPS starter with movement, weapons, enemy AI and vehicles.</li>
        <li><strong>Godot Terrain Generator</strong> — GridMap terrain with tiles, buildings, roads and procedural forests.</li>
        <li><strong>wikiBlocks</strong> — file-based markdown wiki for building a personal knowledge base.</li>
      </ul>

      <h2>Selected projects</h2>
      <ul>
        <li><strong>REBEL.101</strong> — solo-developed dystopian tank combat game (design, code, art, VFX).</li>
        <li><strong>Lancer Tactics</strong> — VFX artist on the Lancer TTRPG digital adaptation.</li>
        <li><strong>Warminer</strong> — lead 3D artist on a sci-fi RTS.</li>
        <li><strong>EION</strong> — dystopian 3D side-scrolling adventure in Godot.</li>
        <li><strong>Universe Island</strong> — flat-shaded low-poly art direction and trailer.</li>
        <li><strong>Nomad's Barge</strong> — fantasy airship featured in the game Bone and Arrow.</li>
      </ul>

      <h2>Environments</h2>
      <ul>
        <li>Warminer, Lakeview Bakery, Forest Ruins, Moon City, Car Factory, Universe Island,
          Creepy Creams, Space Lab and Underwater VFX scenes.</li>
